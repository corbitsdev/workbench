name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Warms the bun install cache once so the parallel jobs below mostly
  # restore rather than reinstall from the network.
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workbench

  typecheck:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workbench
      - run: bun run typecheck

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workbench
      - run: bun run lint
      - run: bun run fmt:check

  # A single fast pass over every workspace's tests. DB-gated suites
  # skip themselves when DATABASE_URL is unset —
  # see test/db-gate.ts — so this job needs no Postgres service.
  unit:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workbench
      - run: bun run test

  # Integration and browser suites under e2e/. CI=true turns DB- and
  # Chrome-gated skips into hard failures.
  e2e:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/workbench
      HUB_DATA_DIR: ${{ runner.temp }}/hub-data
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workbench
      - id: chrome
        uses: browser-actions/setup-chrome@v1
      - run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: mkdir -p "$HUB_DATA_DIR"
      - run: bun run test:e2e
