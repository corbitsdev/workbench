[build]
builder = "dockerfile"
# Path is relative to the repo root (the build context), not to this file.
dockerfilePath = "apps/web/Dockerfile"
watchPatterns = ["apps/web/**", "packages/**", "package.json", "bun.lock"]

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
