<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set the theme before first paint to avoid a flash of the wrong theme.
         Must stay in sync with use-theme.ts (key "cw-theme", default "corbits-light"). -->
    <script>
      function initTheme() {
        const THEMES = new Set(['corbits-dark', 'corbits-light', 'tkww', 'notion']);
        const LEGACY = new Map([
          ['dark', 'corbits-dark'],
          ['light', 'corbits-light'],
        ]);
        const DEFAULT_THEME = 'corbits-light';
        try {
          let t = localStorage.getItem('cw-theme');
          if (t !== null) {
            t = LEGACY.get(t) ?? t;
            document.documentElement.setAttribute('data-theme', THEMES.has(t) ? t : DEFAULT_THEME);
          } else {
            document.documentElement.setAttribute('data-theme', DEFAULT_THEME);
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', DEFAULT_THEME);
        }
      }
      initTheme();
    </script>
    <title>Workbench | Corbits</title>
    <link rel="icon" type="image/svg+xml" href="/corbits-favicon-mono.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
