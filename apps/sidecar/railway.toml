[build]
builder = "dockerfile"
# Path is relative to the repo root (the build context), not to this file.
dockerfilePath = "apps/sidecar/Dockerfile"
# Hub and sidecar MUST deploy in lockstep — a build skew breaks new-agent
# deploys (challenge / "No sidecar connected", even though the WS reconnects)
# and ships stale workflow tools. Railway has no "follow another service"
# primitive, so both services keep an IDENTICAL watch set (covering both apps,
# shared packages, scripts, and workflow defs). A change to either app — not
# just shared packages — now redeploys both. Keep this list in sync with
# apps/hub/railway.toml.
watchPatterns = ["apps/hub/**", "apps/sidecar/**", "packages/**", "scripts/**", "workflows/**", "package.json", "bun.lock"]

[deploy]
startCommand = "bun run apps/sidecar/src/index.ts"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
