services:
  postgres:
    image: postgres:18.2-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench-dev-password
      POSTGRES_DB: workbench
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workbench -d workbench']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
