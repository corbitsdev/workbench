services:
  postgres:
    image: pgvector/pgvector:pg17
    command: postgres -c idle_in_transaction_session_timeout=10min
    environment:
      POSTGRES_USER: workbench
      POSTGRES_PASSWORD: workbench
      POSTGRES_DB: workbench
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "workbench", "-d", "workbench"]
      interval: 2s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  hub:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://workbench:workbench@postgres:5432/workbench
      HUB_DATA_DIR: /data
      PORT: "3000"
      BETTER_AUTH_BASE_URL: http://localhost:3000
    volumes:
      - hub-data:/data
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
  hub-data:
