name: linear-graphql-expansion
worktree: worktrees/expand-linear-graphql-api
base_branch: origin/staging
commit_strategy: per-task

tasks:
  - id: 3a-fix_core_tests
    dir: 3a-fix_core_tests
    agent: intern
    kind: feature
    depends_on: []
    critique: true
  - id: 3b-domain_tests_batch_a
    dir: 3b-domain_tests_batch_a
    agent: intern
    kind: feature
    depends_on: []
    critique: true
  - id: 3c-domain_tests_batch_b
    dir: 3c-domain_tests_batch_b
    agent: intern
    kind: feature
    depends_on: []
    critique: true
  - id: 3d-manifest_phrases_bootstrap
    dir: 3d-manifest_phrases_bootstrap
    agent: intern
    kind: feature
    depends_on: [3a-fix_core_tests]
    critique: true
  - id: 3e-docs_linear_tools
    dir: 3e-docs_linear_tools
    agent: intern
    kind: feature
    depends_on: []
    critique: false
  - id: 4a-full_ci_verify
    dir: 4a-full_ci_verify
    agent: intern
    kind: feature
    depends_on:
      [
        3a-fix_core_tests,
        3b-domain_tests_batch_a,
        3c-domain_tests_batch_b,
        3d-manifest_phrases_bootstrap,
        3e-docs_linear_tools,
      ]
    critique: false
  - id: 5a-review_correctness
    dir: 5a-review_correctness
    agent: critique
    kind: feature
    depends_on: [4a-full_ci_verify]
    critique: false
  - id: 5b-review_approval_security
    dir: 5b-review_approval_security
    agent: critique
    kind: feature
    depends_on: [4a-full_ci_verify]
    critique: false
  - id: 5c-review_graphql_parity
    dir: 5c-review_graphql_parity
    agent: critique
    kind: feature
    depends_on: [4a-full_ci_verify]
    critique: false
