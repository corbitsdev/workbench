<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corbits Workbench — Root Sample</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ============ Corbits brand tokens ============ */
      :root {
        --orange: #e98428;
        --orange-deep: #bf6b20;
        --orange-soft: #f2b277;
        --blue: #607c9a;
        --blue-deep: #2d455c;
        --blue-soft: #c5d2de;
        --green: #7b9974;
        --green-deep: #425a3d;
        --green-soft: #c1d1be;
        --cream: #f7ead5;
        --cream-deep: #e4d5bc;
        --charcoal: #2b2627;
        --charcoal-2: #5c5555;
        --charcoal-deep: #1f1a1b;
        --radius-sm: 8px;
        --radius: 12px;
        --radius-lg: 18px;
        --radius-xl: 24px;
        --radius-panel: 28px;
        --gap: 14px;
        --font-body: "Red Hat Display", "Open Sans", Roboto, Arial, sans-serif;
        --font-mono: "Space Mono", "Fira Code", Monaco, Consolas, monospace;
        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
        --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      /* Light theme */
      html[data-theme="light"] {
        --page: #efdcbe;
        --bg: #f7ead5;
        --bg-rail: #ffffff;
        --surface: #ffffff;
        --surface-2: #f2f4f5;
        --text: #2b2627;
        --text-2: #5c5555;
        --text-3: #9a8e80;
        --border: rgba(43, 38, 39, 0.1);
        --border-strong: rgba(43, 38, 39, 0.22);
        --row-hover: rgba(43, 38, 39, 0.05);
        --shadow:
          0 2px 6px rgba(43, 38, 39, 0.05), 0 18px 50px rgba(43, 38, 39, 0.1);
        --tag-text: #2b2627;
      }
      /* Dark theme */
      html[data-theme="dark"] {
        --page: #151112;
        --bg: #221d1e;
        --bg-rail: #272122;
        --surface: #2b2627;
        --surface-2: #322c2d;
        --text: #f7ead5;
        --text-2: #c3b6a3;
        --text-3: #8a8079;
        --border: rgba(247, 234, 213, 0.1);
        --border-strong: rgba(247, 234, 213, 0.22);
        --row-hover: rgba(247, 234, 213, 0.05);
        --shadow: 0 2px 6px rgba(0, 0, 0, 0.3), 0 22px 60px rgba(0, 0, 0, 0.45);
        --tag-text: #f7ead5;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: var(--font-body);
        background: var(--page);
        color: var(--text);
        font-size: 15px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        transition:
          background 0.4s var(--ease),
          color 0.4s var(--ease);
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: none;
        background: none;
        color: inherit;
      }
      ::selection {
        background: var(--orange);
        color: #fff;
      }
      .mono {
        font-family: var(--font-mono);
      }

      /* ============ Top bar ============ */
      .topbar {
        height: 74px;
        display: flex;
        align-items: center;
        gap: 18px;
        max-width: 1180px;
        margin: 0 auto;
        padding: 0 8px;
        background: transparent;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 11px;
        font-weight: 800;
        font-size: 19px;
        letter-spacing: -0.02em;
      }
      .wordmark .glyph {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        background: var(--orange);
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 16px;
        box-shadow: 0 4px 14px rgba(233, 132, 40, 0.45);
        transition: transform 0.4s var(--spring);
      }
      .wordmark:hover .glyph {
        transform: rotate(-8deg) scale(1.08);
      }
      .crumb {
        color: var(--text-3);
        font-weight: 500;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .crumb svg {
        width: 14px;
        height: 14px;
        opacity: 0.5;
      }
      .topbar .spacer {
        flex: 1;
      }
      .kbd {
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-3);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 2px 6px;
      }
      .iconbtn {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: var(--text-2);
        transition: 0.18s var(--ease);
        border: 1px solid transparent;
      }
      .iconbtn:hover {
        background: var(--row-hover);
        color: var(--text);
        border-color: var(--border);
      }
      .iconbtn svg {
        width: 18px;
        height: 18px;
      }
      .toggle {
        display: flex;
        align-items: center;
        gap: 7px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px;
        background: var(--surface);
      }
      .toggle button {
        width: 30px;
        height: 26px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        color: var(--text-3);
        transition: 0.2s var(--ease);
      }
      .toggle button svg {
        width: 15px;
        height: 15px;
      }
      .toggle button.on {
        background: var(--orange);
        color: #fff;
      }

      /* ============ Shell ============ */
      .shell {
        display: grid;
        grid-template-columns: var(--rail-w, 340px) 16px 1fr;
        max-width: 1180px;
        margin: 0 auto;
        padding: 4px 8px 40px;
        height: calc(100vh - 74px);
      }
      .shell.dragging {
        user-select: none;
      }
      .shell.dragging .rail,
      .shell.dragging .gallery-col {
        transition: none;
      }
      /* drag handle */
      .handle {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: col-resize;
        touch-action: none;
      }
      .handle .grip {
        width: 5px;
        height: 46px;
        border-radius: 999px;
        background: var(--border-strong);
        transition:
          height 0.3s var(--spring),
          background 0.2s var(--ease);
      }
      .handle:hover .grip,
      .handle.active .grip {
        background: var(--orange);
        height: 80px;
      }
      .handle.active .grip {
        box-shadow: 0 0 0 4px rgba(233, 132, 40, 0.2);
      }
      @media (max-width: 1040px) {
        .shell {
          grid-template-columns: 1fr;
          height: auto;
        }
        .handle {
          display: none;
        }
        .gallery-col {
          min-height: 70vh;
        }
      }

      /* ============ Left rail (Linear cues) ============ */
      .rail {
        background: var(--bg-rail);
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .rail-head {
        padding: 18px 18px 10px;
      }
      .rail-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      .search {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 9px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 11px;
        transition: 0.18s var(--ease);
      }
      .search:focus-within {
        border-color: var(--orange);
        box-shadow: 0 0 0 3px rgba(233, 132, 40, 0.16);
      }
      .search svg {
        width: 15px;
        height: 15px;
        color: var(--text-3);
        flex: none;
      }
      .search input {
        border: none;
        background: none;
        outline: none;
        color: var(--text);
        font-size: 14px;
        width: 100%;
      }
      .search input::placeholder {
        color: var(--text-3);
      }
      .search .kbd {
        flex: none;
      }
      .segs {
        display: flex;
        flex-wrap: wrap;
        gap: 3px;
        padding: 12px 16px 6px;
      }
      .seg {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-2);
        padding: 6px 9px;
        border-radius: 9px;
        transition:
          transform 0.3s var(--spring),
          background 0.15s var(--ease),
          color 0.15s var(--ease);
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .seg:active {
        transform: scale(0.94);
      }
      .seg:hover {
        background: var(--row-hover);
      }
      .seg.active {
        background: var(--surface);
        color: var(--text);
        box-shadow: var(--shadow);
      }
      .seg .count {
        font-family: var(--font-mono);
        font-size: 10.5px;
        color: var(--text-3);
      }
      .rail-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 4px 10px 22px;
      }
      .rail-scroll::-webkit-scrollbar {
        width: 9px;
      }
      .rail-scroll::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 9px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      .group-h {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 10px 7px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--text-3);
      }
      .group-h .gc {
        font-family: var(--font-mono);
        font-weight: 400;
        font-size: 11px;
        opacity: 0.7;
      }
      .group-h::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      /* row */
      .row {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 10px 11px;
        border-radius: var(--radius);
        transition:
          transform 0.3s var(--spring),
          background 0.15s var(--ease);
        position: relative;
      }
      .row:hover {
        background: var(--row-hover);
        transform: translateX(4px);
      }
      .row:hover .tag {
        transform: rotate(-3deg) scale(1.05);
      }
      .tag {
        transition: transform 0.35s var(--spring);
      }
      .row.sel {
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .row.sel::before {
        content: "";
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 3px;
        background: var(--orange);
      }
      .st {
        width: 15px;
        height: 15px;
        flex: none;
        border-radius: 50%;
        border: 2px solid var(--text-3);
        position: relative;
      }
      .st.run {
        border-color: var(--orange);
      }
      .st.run::after {
        content: "";
        position: absolute;
        inset: 2px;
        border-radius: 50%;
        background: var(--orange);
      }
      .st.done {
        border: none;
        background: var(--green);
      }
      .st.done::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 1.5px;
        width: 4px;
        height: 8px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(42deg);
      }
      .st.idle::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: var(--text-3);
        opacity: 0.4;
      }
      .row .body {
        flex: 1;
        min-width: 0;
      }
      .row .name {
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .sub {
        font-size: 11.5px;
        color: var(--text-3);
        margin-top: 1px;
        font-family: var(--font-mono);
      }
      .tag {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.03em;
        padding: 3px 8px;
        border-radius: 999px;
        white-space: nowrap;
        flex: none;
        display: flex;
        align-items: center;
        gap: 5px;
        text-transform: uppercase;
      }
      .tag .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .tag.workflow {
        background: rgba(233, 132, 40, 0.16);
        color: var(--orange);
      }
      .tag.workflow .dot {
        background: var(--orange);
      }
      .tag.workbench {
        background: rgba(96, 124, 154, 0.18);
        color: var(--blue);
      }
      .tag.workbench .dot {
        background: var(--blue);
      }
      .tag.agent {
        background: rgba(123, 153, 116, 0.18);
        color: var(--green);
      }
      .tag.agent .dot {
        background: var(--green);
      }
      html[data-theme="light"] .tag.workflow {
        color: var(--orange-deep);
      }
      html[data-theme="light"] .tag.workbench {
        color: var(--blue-deep);
      }
      html[data-theme="light"] .tag.agent {
        color: var(--green-deep);
      }
      .row .avatar {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        flex: none;
        display: grid;
        place-items: center;
        font-size: 10px;
        font-weight: 700;
        color: #fff;
      }

      /* ============ Right gallery ============ */
      .gallery-col {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--radius-panel);
        box-shadow: var(--shadow);
      }
      .gal-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 20px 28px 14px;
      }
      .gal-head h1 {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .gal-head .num {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--text-3);
        background: var(--surface-2);
        padding: 3px 9px;
        border-radius: 7px;
      }
      .gal-head .spacer {
        flex: 1;
      }
      .chip {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-2);
        padding: 7px 13px;
        border-radius: 9px;
        border: 1px solid var(--border);
        transition: 0.15s var(--ease);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .chip:hover {
        border-color: var(--border-strong);
        background: var(--row-hover);
      }
      .chip svg {
        width: 14px;
        height: 14px;
      }
      .chip.solid {
        background: var(--charcoal);
        color: var(--cream);
        border-color: var(--charcoal);
      }
      html[data-theme="dark"] .chip.solid {
        background: var(--cream);
        color: var(--charcoal);
      }
      .gal-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 6px 28px 40px;
        container-type: inline-size;
      }
      .gal-scroll::-webkit-scrollbar {
        width: 10px;
      }
      .gal-scroll::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }

      /* Mondrian masonry grid — fills to the column width, tiles reflow automatically */
      .mondrian {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        grid-auto-rows: 88px;
        gap: var(--gap);
      }
      @container (max-width:440px) {
        .s-w2 {
          grid-column: auto;
        }
        .s-tall {
          grid-row: span 3;
        }
        .s-mid {
          grid-row: span 2;
        }
      }
      .card {
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        cursor: pointer;
        transition:
          transform 0.4s var(--spring),
          box-shadow 0.3s var(--ease),
          border-color 0.3s var(--ease);
        position: relative;
        animation: pop 0.5s var(--spring) both;
      }
      .card:nth-child(2n) {
        animation-delay: 0.04s;
      }
      .card:nth-child(3n) {
        animation-delay: 0.08s;
      }
      .card:nth-child(4n) {
        animation-delay: 0.12s;
      }
      .card:hover {
        transform: translateY(-6px) rotate(-1deg) scale(1.02);
        box-shadow: var(--shadow);
        border-color: var(--border-strong);
        z-index: 5;
      }
      .card:hover .viz {
        transform: scale(1.06);
      }
      .card .thumb .viz {
        transition: transform 0.5s var(--spring);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .card .thumb {
        flex: 1;
        position: relative;
        overflow: hidden;
        display: grid;
        place-items: center;
      }
      .card .meta {
        padding: 11px 13px;
        border-top: 1px solid var(--border);
        background: var(--surface);
      }
      .card .meta .t {
        font-size: 13.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .card .meta .s {
        font-size: 11px;
        color: var(--text-3);
        margin-top: 2px;
        font-family: var(--font-mono);
        display: flex;
        gap: 7px;
        align-items: center;
      }
      .atag {
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 999px;
        backdrop-filter: blur(6px);
        background: rgba(0, 0, 0, 0.32);
        color: #fff;
        z-index: 2;
      }
      .card .open {
        position: absolute;
        top: 9px;
        right: 9px;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(6px);
        display: grid;
        place-items: center;
        opacity: 0;
        transition: 0.2s var(--ease);
        z-index: 2;
      }
      .card:hover .open {
        opacity: 1;
      }
      .card .open svg {
        width: 14px;
        height: 14px;
        color: #fff;
      }

      /* spans */
      .s-tall {
        grid-row: span 4;
      }
      .s-mid {
        grid-row: span 3;
      }
      .s-sm {
        grid-row: span 2;
      }
      .s-w2 {
        grid-column: span 2;
      }
      @media (max-width: 1180px) {
        .s-w2 {
          grid-column: span 2;
        }
      }

      /* thumb fills (flat, brand-driven, Mondrian accents) */
      .fill-cream {
        background: linear-gradient(180deg, var(--cream), var(--cream-deep));
      }
      .fill-orange {
        background: var(--orange);
      }
      .fill-blue {
        background: var(--blue);
      }
      .fill-green {
        background: var(--green);
      }
      .fill-charcoal {
        background: var(--charcoal);
      }
      .fill-paper {
        background: var(--surface-2);
      }
      .thumb svg.viz {
        width: 100%;
        height: 100%;
      }
      .bigletter {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.85);
        position: absolute;
        bottom: 10px;
        right: 12px;
      }

      /* ============ Modal ============ */
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(31, 26, 27, 0.55);
        backdrop-filter: blur(4px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 80;
        padding: 32px;
        opacity: 0;
        transition: opacity 0.25s var(--ease);
      }
      .scrim.show {
        display: flex;
        opacity: 1;
      }
      .modal {
        width: min(880px, 100%);
        max-height: 88vh;
        background: var(--surface);
        border-radius: var(--radius-xl);
        border: 1px solid var(--border-strong);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.4);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transform: translateY(14px) scale(0.985);
        transition: 0.3s var(--ease);
      }
      .scrim.show .modal {
        transform: none;
      }
      .modal-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 18px 22px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head .ic {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        flex: none;
      }
      .modal-head h2 {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .modal-head .ms {
        font-size: 12px;
        color: var(--text-3);
        font-family: var(--font-mono);
        margin-top: 2px;
      }
      .modal-head .spacer {
        flex: 1;
      }
      .modal-preview {
        flex: 1;
        overflow: auto;
        padding: 24px;
        background: var(--surface-2);
      }
      .preview-frame {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        min-height: 300px;
        overflow: hidden;
      }
      .modal-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 22px;
        border-top: 1px solid var(--border);
      }
      .btn {
        font-size: 13px;
        font-weight: 600;
        padding: 9px 16px;
        border-radius: 10px;
        border: 1px solid var(--border);
        transition: 0.15s var(--ease);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .btn:hover {
        background: var(--row-hover);
        border-color: var(--border-strong);
      }
      .btn svg {
        width: 15px;
        height: 15px;
      }
      .btn.primary {
        background: var(--orange);
        color: #fff;
        border-color: var(--orange);
      }
      .btn.primary:hover {
        background: var(--orange-deep);
      }
      .modal-foot .spacer {
        flex: 1;
      }
      /* preview innards */
      .pv-pad {
        padding: 26px 30px;
      }
      .pv-pad h3 {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 6px;
        letter-spacing: -0.01em;
      }
      .pv-pad p {
        color: var(--text-2);
        font-size: 14px;
        line-height: 1.65;
        margin-bottom: 12px;
      }
      .pv-stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 18px 0;
      }
      .pv-stat {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
      }
      .pv-stat .v {
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .pv-stat .l {
        font-size: 11.5px;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-top: 3px;
        font-weight: 600;
      }
      .fade-up {
        animation: fadeUp 0.4s var(--ease) both;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }

      /* ============ Intercom-style agent ============ */
      .launcher {
        position: fixed;
        right: 28px;
        bottom: 28px;
        width: 62px;
        height: 62px;
        border-radius: 50%;
        background: var(--orange);
        box-shadow: 0 10px 30px rgba(233, 132, 40, 0.5);
        display: grid;
        place-items: center;
        cursor: grab;
        z-index: 90;
        touch-action: none;
        transition:
          transform 0.4s var(--spring),
          box-shadow 0.2s var(--ease);
      }
      .launcher:hover {
        transform: scale(1.08);
      }
      .launcher:active {
        cursor: grabbing;
      }
      .launcher.dragging {
        transition: none;
        cursor: grabbing;
        box-shadow: 0 16px 40px rgba(233, 132, 40, 0.6);
      }
      .launcher svg {
        width: 28px;
        height: 28px;
        color: #fff;
        position: absolute;
        transition:
          opacity 0.2s var(--ease),
          transform 0.35s var(--spring);
      }
      .launcher .ic-close {
        opacity: 0;
        transform: rotate(-90deg) scale(0.6);
      }
      .launcher.open .ic-chat {
        opacity: 0;
        transform: rotate(90deg) scale(0.6);
      }
      .launcher.open .ic-close {
        opacity: 1;
        transform: none;
      }
      .launcher .badge {
        position: absolute;
        top: -3px;
        right: -3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--green);
        border: 2.5px solid var(--page);
        font-size: 10px;
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        transition: opacity 0.2s;
      }
      .launcher.open .badge {
        opacity: 0;
      }

      .chatwin {
        position: fixed;
        width: 376px;
        max-width: calc(100vw - 24px);
        height: 548px;
        max-height: calc(100vh - 110px);
        background: var(--surface);
        border: 1px solid var(--border-strong);
        border-radius: 24px;
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.45);
        z-index: 89;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        opacity: 0;
        transform: translateY(18px) scale(0.95);
        transform-origin: bottom right;
        pointer-events: none;
        transition:
          opacity 0.3s var(--ease),
          transform 0.34s var(--spring);
      }
      .chatwin.show {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .chat-head {
        padding: 17px 16px;
        background: var(--orange);
        color: #fff;
        display: flex;
        align-items: center;
        gap: 12px;
        flex: none;
      }
      .chat-head .av {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.22);
        display: grid;
        place-items: center;
        font-weight: 800;
        font-family: var(--font-mono);
        font-size: 15px;
        position: relative;
        flex: none;
      }
      .chat-head .av .on {
        position: absolute;
        bottom: -1px;
        right: -1px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--green);
        border: 2.5px solid var(--orange);
      }
      .chat-head h3 {
        font-size: 16px;
        font-weight: 700;
      }
      .chat-head .sub {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.85);
        margin-top: 1px;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .chat-head .x {
        margin-left: auto;
        width: 32px;
        height: 32px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: #fff;
        transition: 0.15s var(--ease);
      }
      .chat-head .x:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .chat-head .x svg {
        width: 18px;
        height: 18px;
      }
      .chat-body {
        flex: 1;
        overflow-y: auto;
        padding: 18px;
        background: var(--surface-2);
        display: flex;
        flex-direction: column;
        gap: 11px;
      }
      .chat-body::-webkit-scrollbar {
        width: 8px;
      }
      .chat-body::-webkit-scrollbar-thumb {
        background: var(--border-strong);
        border-radius: 8px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      .msg {
        display: flex;
        gap: 9px;
        max-width: 86%;
        animation: fadeUp 0.3s var(--ease) both;
      }
      .msg .mav {
        width: 27px;
        height: 27px;
        border-radius: 50%;
        flex: none;
        background: var(--orange);
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        font-family: var(--font-mono);
      }
      .msg .b {
        padding: 10px 13px;
        font-size: 14px;
        line-height: 1.5;
      }
      .msg.agent {
        align-self: flex-start;
      }
      .msg.agent .b {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px 16px 16px 5px;
        color: var(--text);
      }
      .msg.user {
        align-self: flex-end;
        flex-direction: row-reverse;
      }
      .msg.user .mav {
        background: var(--blue);
      }
      .msg.user .b {
        background: var(--orange);
        color: #fff;
        border-radius: 16px 16px 5px 16px;
      }
      .msg.typing .b {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 14px 14px;
      }

        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-3);
        animation: blink 1.3s infinite;
      }
      .msg.typing .b i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .msg.typing .b i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        60%,
        100% {
          opacity: 0.25;
        }
        30% {
          opacity: 1;
        }
      }
      .chat-quick {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        padding: 0 18px 12px;
        background: var(--surface-2);
      }

        font-size: 12px;
        font-weight: 600;
        color: var(--orange);
        border: 1px solid var(--border);
        background: var(--surface);
        padding: 7px 12px;
        border-radius: 999px;
        transition:
          transform 0.3s var(--spring),
          background 0.15s,
          border-color 0.15s;

      .qk:hover {
        border-color: var(--orange);
        background: rgba(233, 132, 40, 0.1);
      }
      .qk:active {
        transform: scale(0.94);
      }
      .chat-foot {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 13px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        flex: none;
      }
      .chat-foot input {
        flex: 1;
        border: none;
        outline: none;
        background: none;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
      }
      .chat-foot input::placeholder {
        color: var(--text-3);
      }
      .chat-foot .send {
        width: 39px;
        height: 39px;
        border-radius: 50%;
        background: var(--orange);
        display: grid;
        place-items: center;
        color: #fff;
        flex: none;
        transition: transform 0.25s var(--spring);
      }
      .chat-foot .send:hover {
        transform: scale(1.1);
      }
      .chat-foot .send:active {
        transform: scale(0.9);
      }
      .chat-foot .send svg {
        width: 18px;
        height: 18px;
      }
      /* orange accent bar — expands chat into the docked, full-width mode */
      .chat-expand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        height: 20px;
        flex: none;
        background: var(--surface);
        border-top: 1px solid var(--border);
        color: var(--orange);
        transition: background 0.2s var(--ease);
      }
      .chat-expand .bar {
        width: 46px;
        height: 5px;
        border-radius: 999px;
        background: var(--orange);
        transition:
          width 0.3s var(--spring),
          opacity 0.2s;
      }
      .chat-expand:hover {
        background: rgba(233, 132, 40, 0.08);
      }
      .chat-expand:hover .bar {
        width: 74px;
      }
      .chat-expand .lbl {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        opacity: 0;
        max-width: 0;
        overflow: hidden;
        white-space: nowrap;
        transition: 0.25s var(--ease);
      }
      .chat-expand:hover .lbl {
        opacity: 1;
        max-width: 160px;
      }

      /* docked, spanning the full width of the two columns */
      .chatwin {
        transition:
          opacity 0.3s var(--ease),
          transform 0.34s var(--spring),
          width 0.34s var(--spring),
          height 0.34s var(--spring),
          border-radius 0.34s var(--spring);
      }
      .chatwin.docked {
        left: 50%;
        right: auto;
        top: auto;
        bottom: 18px;
        width: min(1164px, calc(100vw - 32px));
        margin-left: calc(min(1164px, calc(100vw - 32px)) / -2);
        height: min(340px, 46vh);
        max-height: 46vh;
        border-radius: 24px;
        transform-origin: bottom center;
      }
      .chatwin.docked .chat-body,
      .chatwin.docked .chat-quick,
      .chatwin.docked .chat-foot {
        padding-left: max(20px, calc(50% - 460px));
        padding-right: max(20px, calc(50% - 460px));
      }
      .chatwin.docked .chat-expand .bar {
        width: 74px;
      }
      .chatwin.docked .chat-expand:hover .bar {
        width: 46px;
      }
      /* lift the columns so the dock sits beneath them */
      body.docked .shell {
        height: calc(100vh - 74px - 392px);
      }
      @media (max-width: 1040px) {
        body.docked .shell {
          height: auto;
        }
      }
    </style>
  </head>

    <script>
      /* ---------- resizable panels ---------- */
      const shell = document.querySelector(".shell"),
        handle = document.getElementById("handle");
      const MIN = 248,
        MAX = 620;
      function setRail(px) {
        const max = Math.min(MAX, shell.clientWidth - 360);
        const w = Math.max(MIN, Math.min(px, max));
        shell.style.setProperty("--rail-w", w + "px");
        try {
          localStorage.setItem("cw-rail", w);
        } catch (e) {}
      }
      (() => {
        try {
          const s = localStorage.getItem("cw-rail");
          if (s) shell.style.setProperty("--rail-w", s + "px");
        } catch (e) {}
      })();
      let drag = false;
      function start(e) {
        drag = true;
        shell.classList.add("dragging");
        handle.classList.add("active");
        if (handle.setPointerCapture && e.pointerId != null)
          handle.setPointerCapture(e.pointerId);
      }
      function move(e) {
        if (!drag) return;
        const x = (e.touches ? e.touches[0] : e).clientX;
        setRail(x - shell.getBoundingClientRect().left);
      }
      function end() {
        drag = false;
        shell.classList.remove("dragging");
        handle.classList.remove("active");
      }
      handle.addEventListener("pointerdown", start);
      window.addEventListener("pointermove", move);
      window.addEventListener("pointerup", end);
      handle.addEventListener("dblclick", () => setRail(340));
      handle.addEventListener("keydown", (e) => {
        const cur =
          parseInt(getComputedStyle(shell).getPropertyValue("--rail-w")) || 340;
        if (e.key === "ArrowLeft") {
          setRail(cur - 24);
          e.preventDefault();
        }
        if (e.key === "ArrowRight") {
          setRail(cur + 24);
          e.preventDefault();
        }
      });

      /* ---------- theme ---------- */
      const root = document.documentElement;
      function setTheme(t) {
        root.setAttribute("data-theme", t);
        document
          .querySelectorAll("#themeToggle button")

      function viz(kind) {
        const w = "rgba(255,255,255,.9)",
          w2 = "rgba(255,255,255,.45)";
        if (kind === "bars")
          return `<svg class="viz" viewBox="0 0 120 80" preserveAspectRatio="none"><rect x="14" y="44" width="14" height="30" fill="${w2}"/><rect x="36" y="30" width="14" height="44" fill="${w}"/><rect x="58" y="38" width="14" height="36" fill="${w2}"/><rect x="80" y="18" width="14" height="56" fill="${w}"/></svg>`;
        if (kind === "donut")
          return `<svg class="viz" viewBox="0 0 120 80"><circle cx="60" cy="40" r="24" fill="none" stroke="${w2}" stroke-width="11"/><circle cx="60" cy="40" r="24" fill="none" stroke="${w}" stroke-width="11" stroke-dasharray="100 150" transform="rotate(-90 60 40)"/></svg>`;
        if (kind === "grid")
          return `<svg class="viz" viewBox="0 0 120 80">${[...Array(15)].map((_, i) => `<rect x="${12 + (i % 5) * 20}" y="${14 + Math.floor(i / 5) * 20}" width="15" height="15" rx="2" fill="${i % 3 ? w2 : w}"/>`).join("")}</svg>`;
        if (kind === "lines")
          return `<svg class="viz" viewBox="0 0 120 80">${[...Array(5)].map((_, i) => `<rect x="16" y="${16 + i * 11}" width="${i % 2 ? 60 : 88}" height="5" rx="2.5" fill="${i ? w2 : w}"/>`).join("")}</svg>`;
        if (kind === "nodes")
          return `<svg class="viz" viewBox="0 0 120 80"><line x1="30" y1="26" x2="70" y2="50" stroke="${w2}" stroke-width="2"/><line x1="70" y1="50" x2="94" y2="24" stroke="${w2}" stroke-width="2"/><line x1="30" y1="26" x2="40" y2="60" stroke="${w2}" stroke-width="2"/><circle cx="30" cy="26" r="7" fill="${w}"/><circle cx="70" cy="50" r="9" fill="${w}"/><circle cx="94" cy="24" r="6" fill="${w2}"/><circle cx="40" cy="60" r="6" fill="${w2}"/></svg>`;
        if (kind === "heat")
          return `<svg class="viz" viewBox="0 0 120 80">${[...Array(24)].map((_, i) => `<rect x="${14 + (i % 6) * 16}" y="${16 + Math.floor(i / 6) * 13}" width="13" height="10" rx="2" fill="rgba(255,255,255,${(0.2 + ((i * 37) % 80) / 100).toFixed(2)})"/>`).join("")}</svg>`;
        if (kind === "deck")
          return `<svg class="viz" viewBox="0 0 120 120"><rect x="22" y="20" width="76" height="46" rx="4" fill="${w}"/><rect x="30" y="30" width="40" height="6" rx="3" fill="rgba(43,38,39,.4)"/><rect x="30" y="42" width="56" height="4" rx="2" fill="rgba(43,38,39,.25)"/><rect x="22" y="74" width="36" height="26" rx="4" fill="${w2}"/><rect x="62" y="74" width="36" height="26" rx="4" fill="${w2}"/></svg>`;
        if (kind === "cal")
          return `<svg class="viz" viewBox="0 0 120 80">${[...Array(14)].map((_, i) => `<rect x="${12 + (i % 7) * 15}" y="${20 + Math.floor(i / 7) * 22}" width="12" height="18" rx="2" fill="${[2, 5, 9].includes(i) ? w : w2}"/>`).join("")}</svg>`;
        return "";
      }
      const mon = document.getElementById("mondrian");
      artifacts.forEach((a, i) => {
        const c = document.createElement("div");
        c.className = "card " + a.span;
        c.innerHTML = `<span class="atag">${a.type}</span>
    <button class="open"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    <div class="thumb ${a.fill}">${viz(a.viz)}<span class="bigletter">${a.type[0]}${(i + 1).toString().padStart(2, "0")}</span></div>
    <div class="meta"><div class="t">${a.t}</div><div class="s"><span>${a.from}</span>·<span>${a.time}</span></div></div>`;
        c.onclick = () => openModal(a, i);

      document.getElementById("artCount").textContent =
        artifacts.length + " items";

      /* ---------- modal ---------- */
      const scrim = document.getElementById("scrim");
      function openModal(a, i) {
        document.getElementById("mTitle").textContent = a.t;
        document.getElementById("mSub").textContent =
          a.type + " · from " + a.from + " · " + a.time;
        const ic = document.getElementById("mIcon");

          (i + 1).toString().padStart(2, "0") +
          "</span>";

      function closeModal() {
        scrim.classList.remove("show");

        if (e.key === "Escape") closeModal();

      function previewBody(a) {
        const big = `<div class="thumb ${a.fill}" style="height:230px;border-radius:0 0 0 0">${viz(a.viz)}</div>`;
        return `<div class="fade-up">${big}<div class="pv-pad">
    <h3>${a.t}</h3>
    <p>Generated by the <strong>${a.from}</strong> ${a.from.includes("Agent") ? "agent" : "workflow"}. This is a sample preview rendered inside the artifact modal — in production it embeds the live ${a.type.toLowerCase()} with full interactivity.</p>
    <div class="pv-stats">
      <div class="pv-stat"><div class="v">${a.type}</div><div class="l">Format</div></div>
      <div class="pv-stat"><div class="v">${a.time}</div><div class="l">Updated</div></div>
      <div class="pv-stat"><div class="v">v3</div><div class="l">Revision</div></div>
    </div>
    <p>Use the actions below to download, share, or open this artifact in its source workbench for editing and re-runs.</p>
  </div></div>`;
      }

      /* ---------- Intercom-style agent ---------- */
      const launcher = document.getElementById("launcher"),
        chatwin = document.getElementById("chatwin");
      const chatBody = document.getElementById("chatBody"),
        chatInput = document.getElementById("chatInput");
      let chatOpen = false;

      /* restore saved launcher position */
      (() => {
        try {
          const p = JSON.parse(localStorage.getItem("cw-launcher") || "null");
          if (p) {
            launcher.style.left = p.x + "px";
            launcher.style.top = p.y + "px";
            launcher.style.right = "auto";
            launcher.style.bottom = "auto";
          }
        } catch (e) {}
      })();

      /* drag vs click */
      let down = false,
        moved = false,
        sx,
        sy,
        ox,
        oy;
      launcher.addEventListener("pointerdown", (e) => {
        down = true;
        moved = false;
        launcher.setPointerCapture(e.pointerId);
        const r = launcher.getBoundingClientRect();
        sx = e.clientX;
        sy = e.clientY;
        ox = r.left;
        oy = r.top;
      });
      launcher.addEventListener("pointermove", (e) => {
        if (!down) return;
        const dx = e.clientX - sx,
          dy = e.clientY - sy;
        if (!moved && Math.hypot(dx, dy) > 6) {
          moved = true;
          launcher.classList.add("dragging");
        }
        if (moved) {
          const sz = launcher.offsetWidth,
            m = 10;
          const x = Math.max(m, Math.min(ox + dx, innerWidth - sz - m));
          const y = Math.max(m, Math.min(oy + dy, innerHeight - sz - m));
          launcher.style.left = x + "px";
          launcher.style.top = y + "px";
          launcher.style.right = "auto";
          launcher.style.bottom = "auto";
          if (chatOpen && !docked) placePanel();
        }
      });
      launcher.addEventListener("pointerup", (e) => {
        down = false;
        launcher.classList.remove("dragging");
        if (moved) {
          const r = launcher.getBoundingClientRect();
          try {
            localStorage.setItem(
              "cw-launcher",
              JSON.stringify({ x: r.left, y: r.top }),
            );
          } catch (e) {}
        } else toggleChat();
      });

      function placePanel() {
        const r = launcher.getBoundingClientRect(),
          m = 12;
        const w = chatwin.offsetWidth,
          h = chatwin.offsetHeight;
        let left = r.right - w;
        if (left < m) left = Math.min(r.left, innerWidth - w - m);
        left = Math.max(m, left);
        let top = r.top - h - 14; /* prefer above the launcher */
        let origin = "bottom";
        if (top < m) {
          top = r.bottom + 14;
          origin = "top";
        } /* else below */
        top = Math.max(m, Math.min(top, innerHeight - h - m));
        const originX =
          r.left + r.width / 2 > innerWidth / 2 ? "right" : "left";
        chatwin.style.left = left + "px";
        chatwin.style.top = top + "px";
        chatwin.style.transformOrigin = origin + " " + originX;
      }
      let docked = false;
      function toggleChat() {
        chatOpen ? closeChat() : openChat();
      }
      function openChat() {
        chatOpen = true;
        chatwin.classList.add("show");
        launcher.classList.add("open");
        if (docked) applyDock(true);
        else placePanel();
        if (!chatBody.dataset.greeted) {
          chatBody.dataset.greeted = "1";
          agentSay(
            "Hi Pontus 👋 I'm Ada, your workbench agent. I can help you find workflows, summarize artifacts, or kick off a run. What are you working on?",
          );
          showQuick([
            "What can you do?",
            "Summarize my artifacts",
            "How do I resize panels?",
          ]);
        }
        setTimeout(() => chatInput.focus(), 320);
      }
      function closeChat() {
        chatOpen = false;
        chatwin.classList.remove("show");
        launcher.classList.remove("open");
        document.body.classList.remove("docked");
      }
      function applyDock(on) {
        docked = on;
        document.getElementById("expandLbl").textContent = on
          ? "Pop out"
          : "Dock full width";
        document.getElementById("chatExpand").title = on
          ? "Pop out as a floating panel"
          : "Dock below the columns";
        if (on) {
          chatwin.style.left =
            chatwin.style.top =
            chatwin.style.transformOrigin =
              ""; /* let CSS .docked drive position */
          chatwin.classList.add("docked");
          document.body.classList.add("docked");
        } else {
          chatwin.classList.remove("docked");
          document.body.classList.remove("docked");
          placePanel();
        }
      }
      function toggleDock() {
        applyDock(!docked);
      }
      document.getElementById("chatExpand").onclick = toggleDock;
      document.getElementById("chatX").onclick = closeChat;
      addEventListener("keydown", (e) => {
        if (e.key === "Escape" && chatOpen) closeChat();
      });
      addEventListener("resize", () => {
        if (chatOpen && !docked) placePanel();
      });

      /* messaging */
      function addMsg(role, html) {
        const m = document.createElement("div");
        m.className = "msg " + role;
        m.innerHTML = `<div class="mav">${role === "user" ? "PA" : "A"}</div><div class="b">${html}</div>`;
        chatBody.appendChild(m);
        chatBody.scrollTop = chatBody.scrollHeight;
        return m;
      }
      function agentSay(t) {
        addMsg("agent", t);
      }
      function showQuick(arr) {
        const q = document.getElementById("chatQuick");
        q.innerHTML = "";
        arr.forEach((t) => {
          const b = document.createElement("button");
          b.className = "qk";
          b.textContent = t;
          b.onclick = () => {
            q.innerHTML = "";
            sendUser(t);
          };
          q.appendChild(b);
        });
      }
      function typing() {
        const m = document.createElement("div");
        m.className = "msg agent typing";
        m.innerHTML =
          '<div class="mav">A</div><div class="b"><i></i><i></i><i></i></div>';
        chatBody.appendChild(m);
        chatBody.scrollTop = chatBody.scrollHeight;
        return m;
      }

      const KB = [
        {
          k: ["can you do", "help", "what do you", "capab"],
          r: "I work across everything in this workbench: I can search your <b>workflows, workbenches and agents</b> on the left, open and summarize any <b>artifact</b> on the right, re-run a workflow, or draft a new one. Try asking me to summarize your artifacts.",
        },
        {
          k: ["summar", "artifact", "artefact"],
          r: "You've got <b>14 artifacts</b>. Highlights: <b>Q2 Revenue by Product</b> (chart, 2h ago), the <b>GTM Strategy Deck</b> (4h ago), and <b>Daily Usage Metrics</b> refreshed today. 6 came from the Revenue Analysis workflow. Want me to open one?",
        },
        {
          k: ["resize", "drag", "panel", "column", "wider", "size"],
          r: "Grab the orange handle between the two panels and drag — the library and artifact grid resize live, and the tiles reflow on their own. Double-click the handle to reset, or focus it and use ← →.",
        },
        {
          k: ["workflow", "run", "revenue", "campaign"],
          r: "Your active workflows: <b>Revenue & Ad Campaign Analysis</b> (runs daily), <b>Daily Product Usage Chart</b> (09:00 UTC), and <b>Faremeter Release Notes</b>. Want me to trigger a run or show the latest output?",
        },
        {
          k: ["agent", "whatsapp", "bonk"],
          r: "5 agents are registered. The <b>WhatsApp Rating Agent</b> is live (1.2k msgs), and the <b>BONK Endpoint Deployer</b> just finished. I can show logs or pause any of them.",
        },
        {
          k: ["theme", "dark", "light"],
          r: "Use the sun/moon toggle up top to switch themes — it remembers your choice. Everything's built on the Corbits palette either way.",
        },
        {
          k: ["hi", "hey", "hello", "yo"],
          r: "Hey! What can I get started for you — a summary, a search, or a new run?",
        },
        {
          k: ["thank", "thanks", "cheers"],
          r: "Anytime. I'm one click away whenever you need me. 🧡",
        },
      ];
      function reply(text) {
        const t = text.toLowerCase();
        const hit = KB.find((e) => e.k.some((k) => t.includes(k)));
        return hit
          ? hit.r
          : "Got it — in this sample I'm running on canned responses, but in the live workbench I'd act on that against your real workflows and artifacts. Try asking about your artifacts, workflows, or how to resize the panels.";
      }
      function sendUser(text) {
        text = text.trim();
        if (!text) return;
        document.getElementById("chatQuick").innerHTML = "";
        addMsg("user", text.replace(/</g, "&lt;"));
        chatInput.value = "";
        const ty = typing();
        setTimeout(
          () => {
            ty.remove();
            agentSay(reply(text));
          },
          700 + Math.random() * 600,
        );
      }
      document.getElementById("chatSend").onclick = () =>
        sendUser(chatInput.value);
      chatInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") sendUser(chatInput.value);
