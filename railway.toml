[build]
builder = "railpack"
buildCommand = "bun install && bun run --filter @gtm/api build"

[deploy]
preDeployCommand = "bun run scripts/db-setup.ts"
startCommand = "bun run --filter @gtm/api start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
